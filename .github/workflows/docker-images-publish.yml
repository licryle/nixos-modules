name: Build and Push Docker Images

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'modules/**/Dockerfile'
      - 'modules/**/src/**'
      - 'modules/**/default.nix'

env:
  REGISTRY: ghcr.io

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dockerized-paseo: ${{ steps.filter.outputs.dockerized-paseo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Here add new modules
          filters: |
            dockerized-paseo:
              - 'modules/dockerized-paseo/**'

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Here add new modules
          - name: dockerized-paseo
            path: ./modules/dockerized-paseo
            enable: ${{ needs.changes.outputs.dockerized-paseo }}

    # Skip the entire job execution if the path filter didn't trigger
    if: ${{ needs.changes.outputs.dockerized-paseo == 'true' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Automatically normalizes owner and repo names to lower-case for GHCR compliance
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.path }}
          file: ${{ matrix.path }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}